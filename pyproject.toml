[project]
name = "model-router"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_router"]

[tool.uv]
package = true

[dependency-groups]
dev = ["ruff", "mypy"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
