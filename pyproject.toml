[project]
name = "model-router"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.10",
    "pydantic-ai-harness[codemode]>=0.52.0",
    "pydantic-ai-slim[anthropic,google,openai]>=2.52.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_router", "src/trial_lab"]

[tool.uv]
package = true

[dependency-groups]
dev = ["ruff", "mypy"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
