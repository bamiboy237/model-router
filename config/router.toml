# Rule-based router settings. Change routing here, not in code.
# Bump policy_version whenever a value below changes, so receipts stay traceable.
policy_version = "rules-2026-10-01.2"

# cheapest_above: cheapest model whose expected success >= min_success.
# best_success: highest expected success; cost breaks ties.
# best_value: highest expected success per dollar.
pick_rule = "cheapest_above"
min_success = 0.8

[roles]
explore = "exploration"
review = "reasoning"
design = "reasoning"
fix = "coding"
build = "coding"
refactor = "coding"
test = "coding"
docs = "writing"

# A failed model gets tries_per_model attempts, each told what failed last time. Then the
# cheapest untried model with a higher success estimate takes over. Provider errors (rate
# limits, outages, network) retry the same model after provider_backoff_s, doubling each
# time, and do not use up its tries.
[escalation]
tries_per_model = 3
provider_retries = 2
provider_backoff_s = 10

# Per-task limits. The orchestrator may lower them for a task, not raise them.
# max_attempts does not count provider retries. Before each attempt, its expected cost
# must fit in what is left of max_cost_micro_usd.
[escalation.budget]
max_attempts = 6
max_cost_micro_usd = 5_000_000  # $5
max_active_ms = 3_600_000       # 60 minutes of machine time; human review time is outside it

# How feedback events count, in attempts. Failed required checks always count as one failure,
# whatever the feedback says. prior_strength is how many attempts the guesses in [models]
# are worth before evidence outweighs them.
[feedback]
prior_strength = 10
human = 1.0
orchestrator = 0.5
partial = 0.5

# GUESSES: typical tokens per job on top of the linked files. Used only to rank
# models by expected cost. Ticket 06 replaces these with medians from trial records.
[usage]
explore = { input_tokens = 40_000, output_tokens = 2_000 }
review = { input_tokens = 60_000, output_tokens = 4_000 }
fix = { input_tokens = 120_000, output_tokens = 6_000 }
build = { input_tokens = 200_000, output_tokens = 12_000 }
refactor = { input_tokens = 200_000, output_tokens = 10_000 }
test = { input_tokens = 150_000, output_tokens = 10_000 }
design = { input_tokens = 80_000, output_tokens = 8_000 }
docs = { input_tokens = 80_000, output_tokens = 8_000 }

# context_limit comes from each provider's model page (read 2026-10-01).
# success values are GUESSES of the chance a job passes its checks, keyed by
# "<kind>/<domain>", "<kind>", or "*", most specific first. Ticket 06 replaces them
# with measured success rates. DeepSeek is omitted until build_model supports it.

[models."openai:gpt-6-astra"]
context_limit = 1_050_000
success = { "*" = 0.92, review = 0.94, design = 0.95 }

[models."openai:gpt-6.1-sol"]
context_limit = 1_050_000
success = { "*" = 0.88, fix = 0.9 }

[models."openai:gpt-5.6-sol"]
context_limit = 1_050_000
success = { "*" = 0.85 }

[models."openai:gpt-6-luna"]
context_limit = 1_050_000
success = { "*" = 0.6, explore = 0.85, docs = 0.8, fix = 0.65 }

[models."google:gemini-3.8-flash"]
context_limit = 1_048_576
success = { "*" = 0.78, explore = 0.88, docs = 0.82 }
