# USD per million tokens, standard tier, short context.
# Sources retrieved with Firecrawl on 2026-09-30:
# https://developers.openai.com/api/docs/pricing
# https://ai.google.dev/gemini-api/docs/pricing
# https://api-docs.deepseek.com/quick_start/pricing
# Token costs only: excludes tools, cache storage, and regional surcharges.
# This schema cannot select long-context or time-dependent rates automatically.
# Gemini 3.8 Flash prices double on 2027-01-01; publish a new version then.
version = "2026-09-30-r4"

# Long-context rates: input = 8.00, cache_read = 0.80,
# cache_write = 10.00, output = 30.00. Not selected automatically.
# The source guarantees promotional pricing at least through 2026-11-21.
[models."openai:gpt-5.6-sol"]
input = 4.00
cache_read = 0.40
cache_write = 5.00
output = 20.00

[models."openai:gpt-6-astra"]
input = 10.00
cache_read = 1.00
cache_write = 12.50
output = 50.00

[models."openai:gpt-6.1-sol"]
input = 2.00
cache_read = 0.10
cache_write = 2.50
output = 10.00

[models."openai:gpt-6-luna"]
input = 0.10
cache_read = 0.01
cache_write = 0.125
output = 0.50

# Gemini bills explicit cache storage per hour, not per token written.
# Storage costs $0.50 per million tokens per hour through 2026-12-31.
# cache_write = 0 assumes no separately reported cache-write tokens;
# cache creation and storage need separate accounting.
[models."google:gemini-3.8-flash"]
input = 0.75
cache_read = 0.075
cache_write = 0.00
output = 3.75

# Peak rates; off-peak input, cache reads, and output cost half.
# Peak: Mon-Fri 01:00-04:00 and 06:00-10:00 UTC, excluding Chinese holidays.
# No separate cache-write premium is listed; writes use the cache-miss input rate.
# V4.1 Flash uses the API ID deepseek-flash. The retired deepseek-v4-flash
# alias now serves the same model; use the current ID instead.
[models."deepseek:deepseek-flash"]
input = 0.30
cache_read = 0.006
cache_write = 0.30
output = 1.20
[models."deepseek:deepseek-v4-pro"]
input = 1.32
cache_read = 0.044
cache_write = 1.32
output = 3.96
