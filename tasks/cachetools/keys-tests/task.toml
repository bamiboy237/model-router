id = "keys-tests"
family = "cachetools"
kind = "test"
domain = "general"
image = "model-router/python:1"
overview = "cachetools is a Python library of memoizing collections and decorators."
instruction = """
`src/cachetools/keys.py` has no tests. Add `tests/test_keys.py`, using `unittest` like
the other test modules, that covers `hashkey`, `methodkey`, `typedkey`, and
`typedmethodkey`: equality and hashing of equal keys, argument order, keyword
arguments, unhashable arguments, typed against untyped keys, and adding keys to plain
tuples. The tests must pass on the current code, and they should fail if the key
functions break. Do not change anything under `src/`.
"""
files = ["src/cachetools/keys.py", "tests/test_func.py"]
protected_paths = ["src/**"]

[upstream]
url = "https://github.com/tkem/cachetools"
sha = "3c082c654c2804b9354e4b62dbd2994f1aac464d"

[[verifiers]]
name = "pytest"
version = "1"
kind = "tests"
command = ["sh", "-c", "PYTHONPATH=src python -m pytest -q tests/test_keys.py"]
timeout_s = 300

[[verifiers]]
name = "mutants"
version = "1"
kind = "tests"
worker_visible = false
command = ["sh", ".lab/kill_mutants.sh", "PYTHONPATH=src python -m pytest -q -x tests/test_keys.py"]
timeout_s = 600
