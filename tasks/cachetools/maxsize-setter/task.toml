id = "maxsize-setter"
family = "cachetools"
kind = "build"
domain = "general"
image = "model-router/python:1"
overview = "cachetools is a Python library of memoizing collections and decorators."
instruction = """
Add a way to resize a cache at runtime. Assigning `cache.maxsize = n` must work on every
cache class (`Cache`, `FIFOCache`, `LFUCache`, `LRUCache`, `RRCache`, `TTLCache`,
`TLRUCache`). Growing the cache only raises the limit. Shrinking it evicts items in the
cache's own eviction order, as `popitem()` does, until `currsize <= n`. Sizes come from
`getsizeof` where one is set. A negative size raises `ValueError` and leaves the cache
unchanged. Document the setter in the `maxsize` docstring.
"""
files = ["src/cachetools/__init__.py", "tests/__init__.py"]

[upstream]
url = "https://github.com/tkem/cachetools"
sha = "3c082c654c2804b9354e4b62dbd2994f1aac464d"

[[verifiers]]
name = "pytest"
version = "1"
kind = "tests"
command = ["sh", "-c", "PYTHONPATH=src python -m pytest -q tests"]
timeout_s = 300
